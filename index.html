<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<title>二月无雪书源发布页 · Legado 阅读</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<script src="https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
<style>
  :root{
    --text:#000000; --muted:#6B7280; --line:rgba(0,0,0,.07);
    --glass:rgba(255,255,255,.55); --glass-border:rgba(255,255,255,.75);
    --bg:#EEF1F5; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* 背景光斑（极淡） */
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;
  }
  body::before{width:340px;height:340px;background:rgba(255,160,140,.16);top:-100px;right:-80px}
  body::after{width:300px;height:300px;background:rgba(150,200,255,.14);bottom:-120px;left:-80px}
  .page{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 14px 40px}

  /* ===== 头部 ===== */
  header{padding:34px 6px 6px}
  .head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .head-btns{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{
    display:flex;align-items:center;gap:5px;border:none;cursor:pointer;text-decoration:none;
    font-family:inherit;font-size:12px;font-weight:600;color:var(--text);border-radius:99px;
    padding:8px 13px;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .icon-btn svg{width:15px;height:15px}
  .icon-btn:active{transform:scale(.95)}
  .title{font-size:24px;font-weight:800;letter-spacing:.5px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .stat{
    background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;
    padding:9px 14px;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .stat .lbl{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat b{display:block;font-size:16px;font-weight:800;color:var(--text);margin-top:1px}
  footer .friendlinks{
    text-align:left;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  footer .friendlinks h4{font-size:13.5px;font-weight:800;margin-bottom:9px;color:var(--text)}
  footer .fl-list{display:flex;flex-wrap:wrap;gap:8px}
  footer .fl-link{
    display:inline-flex;align-items:center;text-decoration:none;color:#3A3F47;font-size:12.5px;
    background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);border-radius:99px;padding:6px 14px;
  }
  footer .fl-empty{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;border:none;border-radius:99px;font-size:14px;font-weight:700;padding:13px 10px;
    cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-dark{background:#000;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .btn-glass{
    background:var(--glass);color:var(--text);border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .search{
    display:flex;align-items:center;gap:9px;margin-top:14px;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:99px;padding:12px 17px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .search svg{width:17px;height:17px;color:#9AA3AF;flex-shrink:0}
  .search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text);font-family:inherit}
  .search input::placeholder{color:#9AA3AF}

  /* ===== 分组 Tab ===== */
  .tabs{
    position:sticky;top:0;z-index:50;display:flex;gap:8px;overflow-x:auto;margin:16px -4px 6px;
    padding:10px 4px;scrollbar-width:none;-ms-overflow-style:none;
    background:rgba(238,241,245,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex-shrink:0;border:none;cursor:pointer;border-radius:99px;padding:8px 14px;
    font-size:13px;font-weight:600;color:#3A3F47;background:var(--glass);font-family:inherit;
    border:1px solid var(--glass-border);display:flex;align-items:center;gap:5px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .15s;
  }
  .tab em{font-style:normal;font-size:10.5px;color:#9AA3AF}
  .tab.active{background:#000;color:#fff;border-color:#000}
  .tab.active em{color:rgba(255,255,255,.7)}

  /* ===== 内容 ===== */
  main{padding:6px 0 10px}
  .upd-line{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 2px}
  .group-head{display:flex;align-items:center;gap:9px;margin:18px 2px 10px}
  .group-head .g-name{font-size:16px;font-weight:800}
  .group-head .g-count{font-size:12px;color:var(--muted)}
  .group-head .g-spacer{flex:1}
  .g-link{
    border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:#3A3F47;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:99px;padding:6px 12px;
    display:flex;align-items:center;gap:4px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .g-link:active{transform:scale(.95)}

  /* ===== 书源卡片：两列 ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{
    position:relative;display:flex;align-items:center;gap:8px;min-width:0;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:13px 12px;cursor:pointer;user-select:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 2px 10px rgba(0,0,0,.03);
    transition:transform .15s,box-shadow .15s;
    animation:fadeUp .35s ease both;
  }
  .card:active{transform:scale(.97)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card-txt{flex:1;min-width:0}
  .card-name{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-host{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-qr{
    flex-shrink:0;width:34px;height:34px;border-radius:11px;border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .card-qr:active{transform:scale(.9)}
  .card-qr svg{width:17px;height:17px;color:#000}

  .empty{text-align:center;color:var(--muted);padding:52px 0;font-size:13px}
  .empty .e-ico{font-size:40px;display:block;margin-bottom:10px}
  .notice{
    margin:14px 2px;padding:11px 14px;border-radius:14px;font-size:12px;line-height:1.7;
    background:rgba(255,247,232,.8);border:1px solid #F2E0B8;color:#8A6A1F;display:none;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }

  /* ===== 弹窗 ===== */
  .mask{
    position:fixed;inset:0;background:rgba(20,24,32,.4);z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .mask.show{display:flex}
  .modal{
    width:100%;max-width:340px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);
    border-radius:22px;padding:22px;text-align:center;position:relative;
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:0 24px 60px rgba(0,0,0,.16);animation:pop .2s ease both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .m-close{
    position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:none;
    background:rgba(0,0,0,.05);color:#3A3F47;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .modal h3{font-size:16px;font-weight:800}
  .modal .m-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .qr-box{
    width:200px;height:200px;margin:16px auto 12px;padding:10px;background:#fff;
    border:1px solid rgba(0,0,0,.06);border-radius:14px;
  }
  .qr-box img,.qr-box canvas,.qr-box svg{width:100% !important;height:100% !important;border-radius:4px}
  .qr-url{
    font-size:11px;color:#3A3F47;background:rgba(0,0,0,.04);border-radius:10px;padding:8px 10px;
    word-break:break-all;margin-bottom:16px;font-family:ui-monospace,Consolas,monospace;
  }
  .m-actions{display:flex;gap:9px}
  .m-btn{
    flex:1;border:none;cursor:pointer;font-family:inherit;border-radius:99px;padding:12px 6px;
    font-size:13px;font-weight:700;transition:transform .15s;
  }
  .m-btn:active{transform:scale(.96)}
  .m-btn.dark{background:#000;color:#fff}
  .m-btn.plain{background:rgba(0,0,0,.05);color:var(--text)}

  /* ===== Toast / 底部 ===== */
  .toast{
    position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.88);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;
    z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 6px 10px;line-height:1.9}
  footer .steps{
    text-align:left;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:16px 16px 12px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  footer .steps h4{font-size:14px;font-weight:800;margin-bottom:9px;color:var(--text)}
  footer .steps li{list-style:none;display:flex;gap:9px;font-size:12.5px;color:#3A3F47;margin-bottom:8px}
  footer .steps .num{
    width:19px;height:19px;border-radius:50%;flex-shrink:0;background:#000;color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  footer .linkline{word-break:break-all}
  footer .disclaimer{
    text-align:left;font-size:11.5px;color:var(--muted);line-height:1.7;margin:0 0 12px;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  footer .foot-links{display:flex;justify-content:center;gap:10px;margin-top:4px}
  footer .foot-link{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);
    font-size:12.5px;font-weight:600;border:none;cursor:pointer;font-family:inherit;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:99px;padding:8px 15px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  footer .foot-link svg{width:15px;height:15px}
  footer .ver{margin-top:12px;font-size:11px;opacity:.85}
</style>
</head>

<script>
(function(){
  "use strict";
  var GROUPS = [
    {key:"novel",  name:"小说源", icon:"📖", file:"sources/novel.json"},
    {key:"qifei",  name:"起飞源", icon:"🚀", file:"sources/qifei.json"},
    {key:"audio",  name:"听书源", icon:"🎧", file:"sources/audio.json"},
    {key:"comic",  name:"漫画源", icon:"🎨", file:"sources/comic.json"},
    {key:"video",  name:"视频源", icon:"🎬", file:"sources/video.json"}
  ];
  var BUILD_DATE = "2026-08-19";
  var ALL_FILE = "sources/all.json";
  var MANIFEST_FILE = "sources/one/manifest.json";

  var state = {data:{}, cur:"all", search:"", oneMap:{}};
  var $ = function(id){ return document.getElementById(id); };
  var toastTimer = null;

  function absUrl(rel){
    var base = location.href.split("#")[0].split("?")[0];
    var i = base.lastIndexOf("/");
    if (i >= 0 && base.slice(i+1).indexOf(".") >= 0) base = base.slice(0, i+1);
    else if (i >= 0) base = base.slice(0, i+1);
    else base = base + "/";
    return base + rel;
  }
  function isFile(){ return location.protocol === "file:"; }
  function asciiUrl(u){ return /[^\x00-\x7F]/.test(u) ? encodeURIComponent(u) : u; }
  function deepLink(url){ return "legado://import/bookSource?src=" + asciiUrl(url); }
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1700);
  }
  function copyText(text, okMsg){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast(okMsg||"已复制"); }
      catch(e){ toast("复制失败，请手动复制"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg||"已复制"); }, fallback);
    } else fallback();
  }
  function fetchJson(url){
    return fetch(url, {cache:"no-cache"}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function loadAll(){
    var jobs = GROUPS.map(function(g){
      return fetchJson(g.file).then(function(arr){
        state.data[g.key] = Array.isArray(arr) ? arr : [];
      }).catch(function(e){
        state.data[g.key] = [];
        console.warn("加载分组失败:", g.file, e);
      });
    });
    jobs.push(fetchJson(MANIFEST_FILE).then(function(list){
      state.oneMap = {};
      (Array.isArray(list)?list:[]).forEach(function(m){
        state.oneMap[m.name + "\u0001" + m.host] = m.id;
      });
    }).catch(function(e){
      console.warn("加载单源清单失败:", e);
    }));
    return Promise.all(jobs);
  }
  function hostOf(s){
    var u = String(s.bookSourceUrl||"").split("#")[0];
    try{ return new URL(u).host; }catch(e){ return u.replace(/^https?:\/\//,"").split("/")[0]; }
  }
  function oneUrlOf(s){
    var id = state.oneMap[(s.bookSourceName||"") + "\u0001" + hostOf(s)];
    if (!id) return null;
    return absUrl("sources/one/" + id + ".json");
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  }); }

  /* 二维码图标（内联 SVG） */
  var QR_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm9-2h7v7h-7V3zm2 2v3h3V5h-3zM3 14h7v7H3v-7zm2 2v3h3v-3H5zm7-3h2v2h-2v-2zm4 0h2v2h-2v-2zm-2 3h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 3h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg>';

  function renderTabs(){
    var el = $("tabs"); el.innerHTML = "";
    function tab(label, key, icon, count, active){
      var b = document.createElement("button");
      b.className = "tab" + (active ? " active" : "");
      b.dataset.group = key;
      b.innerHTML = '<span>' + icon + '</span>' + '<em>' + count + '</em>' + '<span>' + label + '</span>';
      b.addEventListener("click", function(){ switchTab(key); });
      el.appendChild(b);
    }
    var total = 0;
    GROUPS.forEach(function(g){ total += (state.data[g.key]||[]).length; });
    tab("全部", "all", "🏠", total, state.cur === "all");
    GROUPS.forEach(function(g){
      tab(g.name, g.key, g.icon, (state.data[g.key]||[]).length, state.cur === g.key);
    });
    var activeTab = el.querySelector(".tab.active");
    if (activeTab) activeTab.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  }

  function cardHTML(s, g, index, oneUrl){
    var url = oneUrl || absUrl(g.file);
    return '' +
      '<div class="card" style="animation-delay:' + Math.min(index*25, 300) + 'ms" data-copy="' + escAttr(url) + '">' +
        '<div class="card-txt">' +
          '<div class="card-name">' + esc(s.bookSourceName) + '</div>' +
          '<div class="card-host">' + esc(hostOf(s)) + '</div>' +
        '</div>' +
        '<button class="card-qr" data-qr="' + escAttr(url) + '" data-name="' + escAttr(s.bookSourceName) + '" title="二维码">' + QR_ICON + '</button>' +
      '</div>';
  }
  function escAttr(s){ return esc(s); }

  function groupHeadHTML(g, list){
    var url = absUrl(g.file);
    return '' +
      '<div class="group-head">' +
        '<span class="g-name">' + g.icon + ' ' + g.name + '</span>' +
        '<span class="g-count">' + list.length + ' 个</span>' +
        '<div class="g-spacer"></div>' +
        '<button class="g-link" data-gqr="' + escAttr(url) + '" data-gname="' + escAttr(g.name) + '">二维码</button>' +
        '<button class="g-link" data-gcopy="' + escAttr(url) + '">复制</button>' +
      '</div>';
  }

  function renderContent(){
    var main = $("content");
    main.innerHTML = "";
    main.appendChild(htmlToNode('<div class="upd-line">🕒 更新时间：' + BUILD_DATE + '</div>'));
    var q = state.search.trim().toLowerCase();
    var visible = 0;
    function filter(list){
      if (!q) return list;
      return list.filter(function(s){
        var hay = ((s.bookSourceName||"") + " " + (s.bookSourceGroup||"") + " " + hostOf(s)).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }
    function renderGroup(g){
      var filtered = filter(state.data[g.key] || []);
      if (filtered.length === 0) return;
      visible += filtered.length;
      main.appendChild(htmlToNode(groupHeadHTML(g, filtered)));
      var grid = document.createElement("div");
      grid.className = "grid";
      filtered.forEach(function(s, i){
        grid.insertAdjacentHTML("beforeend", cardHTML(s, g, i, oneUrlOf(s)));
      });
      main.appendChild(grid);
    }
    if (state.cur === "all"){
      GROUPS.forEach(renderGroup);
      if (visible === 0) main.appendChild(htmlToNode(emptyHTML(q)));
    } else {
      var g = null;
      GROUPS.forEach(function(x){ if (x.key === state.cur) g = x; });
      if (!g) return;
      var filtered = filter(state.data[g.key] || []);
      if (filtered.length === 0){ main.appendChild(htmlToNode(emptyHTML(q))); return; }
      visible = filtered.length;
      main.appendChild(htmlToNode(groupHeadHTML(g, filtered)));
      var grid = document.createElement("div");
      grid.className = "grid";
      filtered.forEach(function(s, i){
        grid.insertAdjacentHTML("beforeend", cardHTML(s, g, i, oneUrlOf(s)));
      });
      main.appendChild(grid);
    }
    renderFooter();
  }
  function emptyHTML(q){
    return '<div class="empty"><span class="e-ico">🔍</span>' +
      (q ? '没有找到「' + esc(q) + '」' : '书源整理中，敬请期待') + '</div>';
  }
  function htmlToNode(html){
    var t = document.createElement("template");
    t.innerHTML = html;
    return t.content.firstElementChild;
  }
  /* 友情链接（在此添加：{name:"名字", url:"https://..."}） */
  var FRIEND_LINKS = [];
  function renderFriendLinks(){
    var el = $("friendList");
    if (!el) return;
    if (!FRIEND_LINKS.length){
      el.innerHTML = '<span class="fl-empty">敬请期待</span>';
      return;
    }
    el.innerHTML = FRIEND_LINKS.map(function(l){
      return '<a class="fl-link" href="' + escAttr(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>';
    }).join("");
  }
  function renderFooter(){
    $("baseUrl").textContent = absUrl("");
    renderFriendLinks();
  }

  function switchTab(key){
    state.cur = key;
    try{ history.replaceState(null, "", "#" + (key === "all" ? "" : key)); }catch(e){}
    renderTabs();
    renderContent();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  var currentQR = null;
  function openQR(name, url){
    $("qrTitle").textContent = name;
    $("qrSub").textContent = "扫码打开链接，即可网络导入";
    $("qrUrl").textContent = url;
    var box = $("qrBox");
    box.innerHTML = "";
    try{
      new QRCode(box, {text:url, width:180, height:180, correctLevel:QRCode.CorrectLevel.M});
    }catch(e){
      console.warn("QRCode 生成失败:", e);
      box.innerHTML = '<div style="font-size:12px;color:#9AA3AF;padding-top:66px">二维码生成失败<br>请复制链接使用</div>';
    }
    $("qrMask").classList.add("show");
    currentQR = {url:url};
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest ? e.target : null;
    if (!t) return;
    if (t.classList.contains("tab")) return;
    var qr = t.closest("[data-qr]");
    if (qr){ openQR(qr.getAttribute("data-name"), qr.getAttribute("data-qr")); return; }
    var gqr = t.closest("[data-gqr]");
    if (gqr){ openQR(gqr.getAttribute("data-gname"), gqr.getAttribute("data-gqr")); return; }
    var gcopy = t.closest("[data-gcopy]");
    if (gcopy){ copyText(gcopy.getAttribute("data-gcopy"), "已复制分组导入地址"); return; }
    var card = t.closest("[data-copy]");
    if (card){ copyText(card.getAttribute("data-copy"), "已复制该书源网络导入链接"); return; }
  });

  $("btnImportAll").addEventListener("click", function(){
    window.location.href = deepLink(absUrl(ALL_FILE));
  });
  $("btnCopyAll").addEventListener("click", function(){
    copyText(absUrl(ALL_FILE), "已复制全部书源导入地址");
  });
  $("btnQQ").addEventListener("click", function(){
    copyText("1097919737", "已复制Q群号 1097919737");
  });
  $("footQQ").addEventListener("click", function(){
    copyText("1097919737", "已复制Q群号 1097919737");
  });
  $("qrClose").addEventListener("click", function(){ $("qrMask").classList.remove("show"); });
  $("qrMask").addEventListener("click", function(e){ if (e.target === this) this.classList.remove("show"); });
  $("qrCopyUrl").addEventListener("click", function(){
    if (currentQR) copyText(currentQR.url, "已复制网络导入链接");
  });
  $("qrOpen").addEventListener("click", function(){
    if (currentQR) window.location.href = deepLink(currentQR.url);
  });
  $("searchInput").addEventListener("input", function(){ state.search = this.value; renderContent(); });

  loadAll().then(function(){
    var hash = (location.hash||"").replace("#","");
    if (hash){
      GROUPS.forEach(function(g){ if (g.key === hash) state.cur = g.key; });
    }
    $("statGroups").textContent = GROUPS.map(function(g){ return g.name; }).join(" · ");
    $("statTime").textContent = BUILD_DATE;
    $("footTime").textContent = BUILD_DATE;
    renderTabs();
    renderContent();
    if (isFile()){
      var n = document.createElement("div");
      n.className = "notice";
      n.style.display = "block";
      n.textContent = "⚠️ 当前为本地预览，一键导入与二维码需部署后使用。";
      var main = $("content");
      main.parentNode.insertBefore(n, main);
    }
  }).catch(function(e){
    $("content").innerHTML = '<div class="empty"><span class="e-ico">😵</span>书源加载失败<br><span style="font-size:11px">' + esc(e && e.message) + '</span></div>';
  });

  function totalCount(){
    var n = 0;
    GROUPS.forEach(function(g){ n += (state.data[g.key]||[]).length; });
    return n;
  }
})();
</script>
</body>
</html>
